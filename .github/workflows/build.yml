name: Build
on:
  push:
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - run: mvn -B clean package
      - uses: actions/upload-artifact@v4
        with:
          name: BedrockMovementFix-jar
          path: target/*.jar
