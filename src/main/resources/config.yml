# BedrockMovementFix 2.1.1
enabled: true
debug: true
bedrock-only: true
bypass-permission: bedrockmovementfix.bypass

# Watchdog cadence.
watchdog-interval-ticks: 2

# A fail sequence must contain this many CLIPPED_INTO_BLOCK failures
# inside fail-move-window-ms before it can qualify.
fail-move-threshold: 4
fail-move-window-ms: 1000

# Movement stall requirement.
stall-ms: 350
minimum-movement-delta: 0.02

# Recent movement/failure activity window.
activity-window-ms: 1200

# One-shot correction cooldown.
correction-cooldown-ms: 3000

# Grace periods prevent correction immediately after lifecycle changes.
join-grace-ms: 2500
teleport-grace-ms: 1200
world-change-grace-ms: 1200

# Special-block proximity.
special-block-radius: 1.75
special-blocks:
  - BAMBOO
  - BAMBOO_SAPLING

# Safest correction: resend the player's current server location/rotation.
# Alternative: last-accepted (only when <= max-restore-distance).
correction-mode: same-location
max-restore-distance: 1.50

# Never force PlayerFailMoveEvent#setAllowed(true).
never-allow-failed-move: true

ignore-dead: true
ignore-spectator: true
ignore-vehicles: true
