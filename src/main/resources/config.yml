# BedrockMovementFix 2.1.3
# Correction requires BOTH a CLIPPED_INTO_BLOCK burst and real loss of
# server-side positional progress. Ordinary clipped movement is ignored.
enabled: true
debug: true
bedrock-only: true
bypass-permission: bedrockmovementfix.bypass

watchdog-interval-ticks: 2

# Collision-failure signal.
fail-move-threshold: 4
fail-move-window-ms: 1000

# Hysteresis:
# SUSPECTED is entered when the two signals begin to overlap.
# CONFIRMED requires sustained loss of positional progress.
suspect-window-ms: 1000
confirmation-window-ms: 500

# Progress test.
# A sample counts as progress when server position advances by at least
# this distance in the player's recent movement direction.
minimum-progress-distance: 0.08
minimum-progress-samples: 3
progress-sample-window-ms: 700
minimum-stalled-samples: 3

# Player must have recent movement/activity; standing still is never a reason
# for correction.
activity-window-ms: 1200

correction-cooldown-ms: 3000
join-grace-ms: 2500
teleport-grace-ms: 1200
world-change-grace-ms: 1200

special-block-radius: 1.75
special-blocks:
  - BAMBOO
  - BAMBOO_SAPLING

# SAME_LOCATION is deliberately the safest default.
# LAST_ACCEPTED is available but disabled by default.
correction-mode: same-location
max-restore-distance: 1.50

ignore-dead: true
ignore-spectator: true
ignore-vehicles: true
