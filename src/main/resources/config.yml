# BedrockMovementFix 2.1.2
# Conservative CLIPPED_INTO_BLOCK burst watchdog.
# It NEVER calls PlayerFailMoveEvent#setAllowed(true).
enabled: true
debug: true
bedrock-only: true
bypass-permission: bedrockmovementfix.bypass

watchdog-interval-ticks: 2

# Main signal: repeated collision validation failures.
fail-move-threshold: 4
fail-move-window-ms: 1000

# Movement is considered "restricted" when recent movement deltas are
# consistently small or the player has not made meaningful progress.
movement-desync-window-ms: 700
movement-low-delta: 0.15
movement-samples-required: 3

# The player must be active/recently moving; this prevents a stationary
# player standing in bamboo from triggering correction.
activity-window-ms: 1200

correction-cooldown-ms: 3000
join-grace-ms: 2500
teleport-grace-ms: 1200
world-change-grace-ms: 1200

special-block-radius: 1.75
special-blocks:
  - BAMBOO
  - BAMBOO_SAPLING

# Safest option. "last-accepted" is available but disabled by default.
correction-mode: same-location
max-restore-distance: 1.50

ignore-dead: true
ignore-spectator: true
ignore-vehicles: true
