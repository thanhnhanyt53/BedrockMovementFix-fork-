# BedrockMovementFix 2.1.0
# Watchdog mode. No ProtocolLib or PacketEvents dependency.
#
# IMPORTANT:
# Bukkit/Paper cannot see Bedrock packets that were lost before reaching
# the backend. This watchdog detects a server-observable stall pattern and
# can send ONE authoritative Bukkit teleport/sync pulse. It does NOT
# teleport every tick and never calls PlayerFailMoveEvent#setAllowed(true).

enabled: true
debug: true

bedrock-only: true
bypass-permission: "bedrockmovementfix.bypass"

# Watchdog polling interval.
watchdog-interval-ticks: 5

# Consider the player stalled when there is no accepted movement for this
# many milliseconds while activity continues.
stall-ms: 700

# Activity remains "fresh" for this long after interaction/animation.
activity-window-ms: 900

# After a correction, do not correct again for this long.
correction-cooldown-ms: 3000

# Ignore players shortly after join/teleport/world change.
join-grace-ms: 2500
teleport-grace-ms: 1200
world-change-grace-ms: 1200

# Only trigger the special-block branch when the player is within this
# horizontal/vertical radius of a configured block.
special-block-radius: 1.75

# Correction safety:
#  - same-location: resend the server-authoritative position/rotation once.
#  - last-accepted: restore the last accepted position only if it differs
#    by no more than max-restore-distance.
correction-mode: same-location
max-restore-distance: 1.50

# Special block signals.
special-blocks:
  - BAMBOO
  - BAMBOO_SAPLING

# FailMove signals are diagnostic and can qualify a watchdog incident.
handle-fail-move: true

# Do not correct players in these states.
ignore-dead: true
ignore-spectator: true
ignore-vehicles: true
